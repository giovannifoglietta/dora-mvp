<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dora — Test Console</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0b141a;
    color: #e9edef;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }
  .pane { display: flex; flex-direction: column; height: 100%; }
  .chat-pane { flex: 1; max-width: 500px; border-right: 1px solid #222d34; }
  .state-pane { flex: 1; overflow-y: auto; padding: 16px; background: #111b21; }

  .header {
    background: #202c33;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #222d34;
  }
  .header h1 { font-size: 16px; font-weight: 500; }
  .header .sub { font-size: 12px; color: #8696a0; }
  .controls { display: flex; gap: 8px; }
  .controls input {
    background: #2a3942;
    border: none;
    color: #e9edef;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    width: 140px;
  }
  button {
    background: #00a884;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  button.danger { background: #c0392b; }
  button:hover { opacity: 0.9; }

  .messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background: #0b141a url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='1' cy='1' r='1' fill='%23182229'/></svg>");
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg.user {
    background: #005c4b;
    align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .msg.dora {
    background: #202c33;
    align-self: flex-start;
    border-bottom-left-radius: 2px;
  }
  .msg.system {
    background: transparent;
    align-self: center;
    color: #8696a0;
    font-size: 12px;
    font-style: italic;
  }

  .input-bar {
    padding: 12px 16px;
    background: #202c33;
    display: flex;
    gap: 8px;
  }
  .input-bar input {
    flex: 1;
    background: #2a3942;
    border: none;
    color: #e9edef;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 14px;
  }
  .input-bar input:focus { outline: none; }

  .state-section { margin-bottom: 24px; }
  .state-section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #8696a0;
    margin-bottom: 8px;
  }
  .state-row {
    background: #202c33;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .state-row .pri { font-weight: 500; }
  .state-row .sec { color: #8696a0; font-size: 12px; margin-top: 2px; }
  .badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.confirmed { background: #00a884; color: white; }
  .badge.cancelled { background: #555; color: #ccc; }
  .empty { color: #8696a0; font-size: 12px; padding: 8px 0; }

  .typing { font-style: italic; opacity: 0.7; }
</style>
</head>
<body>

<div class="pane chat-pane">
  <div class="header">
    <div>
      <h1>Dora</h1>
      <div class="sub">Test conversation</div>
    </div>
    <div class="controls">
      <input id="phone" type="text" value="+39555000001" placeholder="Phone">
      <button class="danger" onclick="reset()">Reset</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <form class="input-bar" onsubmit="send(event)">
    <input id="text" type="text" placeholder="Scrivi un messaggio…" autofocus autocomplete="off">
    <button type="submit">Invia</button>
  </form>
</div>

<div class="pane state-pane">
  <div class="state-section">
    <h2>Bookings</h2>
    <div id="bookings"></div>
  </div>
  <div class="state-section">
    <h2>Clients</h2>
    <div id="clients"></div>
  </div>
  <div class="state-section">
    <h2>Practitioners</h2>
    <div id="practitioners"></div>
  </div>
</div>

<script>
const $messages = document.getElementById('messages');
const $text = document.getElementById('text');
const $phone = document.getElementById('phone');

function addMsg(text, who) {
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.textContent = text;
  $messages.appendChild(div);
  $messages.scrollTop = $messages.scrollHeight;
  return div;
}

async function send(e) {
  e.preventDefault();
  const text = $text.value.trim();
  if (!text) return;
  $text.value = '';

  addMsg(text, 'user');
  const typing = addMsg('Dora sta scrivendo…', 'dora');
  typing.classList.add('typing');

  try {
    const r = await fetch('/test/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: $phone.value, text }),
    });
    const data = await r.json();
    typing.remove();
    addMsg(data.reply, 'dora');
  } catch (err) {
    typing.remove();
    addMsg(`Errore: ${err.message}`, 'system');
  }
  refreshState();
}

async function reset() {
  if (!confirm('Cancellare tutti i clienti e prenotazioni?')) return;
  await fetch('/api/reset', { method: 'POST' });
  $messages.innerHTML = '';
  addMsg('— Stato resettato —', 'system');
  refreshState();
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

async function refreshState() {
  const r = await fetch('/api/state');
  const s = await r.json();

  const $b = document.getElementById('bookings');
  $b.innerHTML = s.bookings.length === 0
    ? '<div class="empty">No bookings yet</div>'
    : s.bookings.map(b => `
        <div class="state-row">
          <div class="pri">${b.client_name || '?'} <span class="badge ${b.status}">${b.status}</span></div>
          <div class="sec">${fmtDate(b.starts_at)} · ${b.service} · ${b.duration_minutes}min</div>
        </div>
      `).join('');

  const $c = document.getElementById('clients');
  $c.innerHTML = s.clients.length === 0
    ? '<div class="empty">No clients yet</div>'
    : s.clients.map(c => `
        <div class="state-row">
          <div class="pri">${c.name}</div>
          <div class="sec">${c.phone} · last seen ${fmtDate(c.last_seen)}</div>
        </div>
      `).join('');

  const $p = document.getElementById('practitioners');
  $p.innerHTML = s.practitioners.map(p => `
    <div class="state-row">
      <div class="pri">${p.name}</div>
      <div class="sec">${p.profession || ''}</div>
    </div>
  `).join('');
}

refreshState();
setInterval(refreshState, 10000);
</script>
</body>
</html>
